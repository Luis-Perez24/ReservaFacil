# Este es el archivo que Coolify despliega. Ningún servicio publica puertos al
# host: Coolify asigna el dominio por servicio desde su panel (Servicios →
# elegir el contenedor → Domains) y enruta a través de su propia red de proxy,
# detectando el puerto en el que escucha cada uno. Publicar puertos aquí no
# ayuda a eso y puede chocar con el puerto de otro proyecto en la misma VPS.
#
# Solo `web` necesita dominio asignado: es el único origen público, y hacia
# adentro reenvía la API y el WebSocket (ver apps/web/nginx.conf). `mailpit`
# también puede llevar un dominio propio —para revisar los recordatorios
# enviados en la demo— pero nunca sin `MP_UI_AUTH`, que es lo único que le
# pone una contraseña a su bandeja.
#
# Para probar el build completo en local antes de tocar Coolify, se corre
# igual (`docker-compose -f docker-compose.prod.yml --env-file .env.prod up
# --build`) y se verifica por dentro de la red de compose, no por el host:
#
#   docker run --rm --network <proyecto>_default curlimages/curl -s http://web/

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro de la red de compose los servicios se alcanzan por su nombre,
      # no por localhost. Estos overrides ganan sobre lo que traiga el .env.
      NODE_ENV: production
      POSTGRES_HOST: postgres
      # Puerto INTERNO de postgres en la red de compose (5432), no el que el
      # .env mapea al host para desarrollo. Mismo motivo para redis.
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      # Mismo motivo: mailpit es un servicio de este compose, alcanzable por
      # su nombre, no por el localhost:1025 que trae el .env de desarrollo.
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      # Este servicio es el único que aplica migraciones al arrancar.
      RUN_MIGRATIONS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Sin curl en la imagen slim: node hace la sonda contra Swagger, que
      # responde 200 solo si la app terminó de bootear.
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/docs',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Mismo codebase que `api`, misma imagen, distinto comando (`02-arquitectura.md`):
  # consume la cola de recordatorios en vez de servir HTTP. Depende de que
  # `api` esté healthy —no directo de postgres/redis— porque las migraciones
  # las aplica el entrypoint de `api`; el worker no debe arrancar sobre un
  # esquema a medio migrar.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      WORKER_MODE: 'true'
    command: ['node', 'dist/main.worker.js']
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # SMTP real, no de mentira: mismo motivo que en desarrollo (comentario en
  # docker-compose.yml), la diferencia es que aquí sirve para comprobar en la
  # demo que el mecanismo de recordatorios funciona de punta a punta, sin
  # depender de contratar un proveedor de correo real para un proyecto de
  # portafolio.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    environment:
      # Sin esto la bandeja queda abierta a cualquiera que encuentre el
      # dominio, y ahi llegan nombre y email reales de quien reserve en la
      # demo. Se define en .env.prod, nunca en este archivo.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?falta MAILPIT_UI_AUTH}

volumes:
  pgdata:
  redisdata:
