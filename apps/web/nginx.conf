# Sitio del frontend. Sirve la SPA compilada y, bajo el mismo origen, reenvía
# las rutas de la API al servicio `api`. Un solo dominio: sin CORS y con un
# solo certificado. La alternativa —api en un subdominio con CORS— es válida
# pero se descartó por simplicidad para un despliegue de un solo ambiente.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # DNS embebido de Docker: resuelve el nombre `api` en tiempo de request, así
  # nginx arranca aunque el api todavía no esté listo y tolera que cambie de IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Assets con hash en el nombre (Angular los versiona): cache agresivo seguro.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API bajo el mismo origen. $request_uri preserva path y query string tal cual
  # (p. ej. availability?serviceId=…&date=…); con la variable en proxy_pass, la
  # resolución del host ocurre en runtime vía el resolver de arriba.
  location ~ ^/(public|payments|auth|tenants|analytics|services|availability)(/|$) {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket de Socket.IO: mismo destino, con upgrade de protocolo.
  location /socket.io/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Cualquier otra ruta es de la SPA: la resuelve el router de Angular.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
