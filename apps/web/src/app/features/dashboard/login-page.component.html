<main class="login">
  <section class="login__brand" #brandPanel (mousemove)="onBrandMouseMove($event, brandPanel)">
    <div class="login__glow login__glow--one" aria-hidden="true"></div>
    <div class="login__glow login__glow--two" aria-hidden="true"></div>
    <div class="login__grid" aria-hidden="true"></div>
    <div class="login__spotlight" aria-hidden="true"></div>

    <div class="login__sparkle login__sparkle--one" aria-hidden="true"></div>
    <div class="login__sparkle login__sparkle--two" aria-hidden="true"></div>
    <div class="login__sparkle login__sparkle--three" aria-hidden="true"></div>
    <div class="login__sparkle login__sparkle--four" aria-hidden="true"></div>
    <div class="login__sparkle login__sparkle--five" aria-hidden="true"></div>

    <div class="login__brand-content">
      <p class="login__mark login__fade-in" style="--delay: 0ms">ReservaFácil</p>
      <h1 class="login__headline login__fade-in" style="--delay: 90ms">
        <span class="login__shimmer">Tu negocio,<br />siempre a tiempo.</span>
      </h1>
      <p class="login__copy login__fade-in" style="--delay: 180ms">
        Reservas, métricas y un asistente que responde por ti — todo en un
        solo panel, listo cuando tú lo estés.
      </p>
    </div>
  </section>

  <section class="login__form-side">
    <div class="login__ambient" aria-hidden="true"></div>
    <div class="login__grain" aria-hidden="true"></div>

    <form class="login__card reveal is-visible" [formGroup]="form" (ngSubmit)="submit()">
      <div class="login__form-header">
        <h2 class="login__title">Bienvenido de vuelta</h2>
        <p class="login__subtitle">Inicia sesión para entrar a tu panel</p>
      </div>

      <label class="field">
        <span class="field__label">Email</span>
        <input
          class="field__input"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="tu@negocio.cl"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field__error">Escribe un email válido.</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <span class="login__password-wrap">
          <input
            class="field__input"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button
            class="login__password-toggle"
            type="button"
            (click)="toggleShowPassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword()"
          >
            @if (showPassword()) {
              <!-- ojo tachado -->
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M3.28 2.22 2.22 3.28l4.02 4.02C4.36 8.64 2.87 10.4 2 12c1.6 3.1 4.9 6 10 6 1.7 0 3.2-.36 4.5-.98l3.22 3.22 1.06-1.06L3.28 2.22ZM12 16c-3.86 0-6.5-2.15-7.87-4C4.9 10.6 6 9.3 7.4 8.4l1.9 1.9A3.5 3.5 0 0 0 12 15.5c.4 0 .78-.06 1.14-.18l1.2 1.2c-.72.3-1.5.48-2.34.48Zm.4-3.9-2-2A1.98 1.98 0 0 1 12 10c1.1 0 2 .9 2 2 0 .18-.02.35-.06.5l-1.54-1.54.0.14Zm7.47.9c-.5.98-1.24 2-2.23 2.86l1.06 1.06c1.2-1.05 2.1-2.3 2.7-3.42-1.6-3.1-4.9-6-10-6-.86 0-1.68.1-2.46.28l1.24 1.24c.4-.06.8-.1 1.22-.1 3.86 0 6.5 2.15 7.87 4Z"
                />
              </svg>
            } @else {
              <!-- ojo abierto -->
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 6c-5.1 0-8.4 2.9-10 6 1.6 3.1 4.9 6 10 6s8.4-2.9 10-6c-1.6-3.1-4.9-6-10-6Zm0 10c-3.86 0-6.5-2.15-7.87-4C5.5 10.15 8.14 8 12 8s6.5 2.15 7.87 4c-1.37 1.85-4.01 4-7.87 4Zm0-6.5A2.5 2.5 0 1 0 12 14.5 2.5 2.5 0 0 0 12 9.5Z"
                />
              </svg>
            }
          </button>
        </span>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field__error">Escribe tu contraseña.</span>
        }
      </label>

      @if (loginError(); as error) {
        <p class="field__error" role="alert">{{ error }}</p>
      }

      <button class="button login__submit" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        Entrar
      </button>
    </form>
  </section>
</main>
