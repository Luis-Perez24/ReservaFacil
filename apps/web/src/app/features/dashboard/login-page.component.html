<main class="login">
  <form class="login__card reveal is-visible" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login__title">ReservaFacil</h1>
    <p class="login__subtitle">Panel del negocio</p>

    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Escribe un email válido.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <input
        class="field__input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Escribe tu contraseña.</span>
      }
    </label>

    @if (loginError(); as error) {
      <p class="field__error" role="alert">{{ error }}</p>
    }

    <button class="button login__submit" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <span class="spinner" aria-hidden="true"></span>
      }
      Entrar
    </button>
  </form>
</main>
