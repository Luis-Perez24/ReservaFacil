<main class="login">
  <section class="login__brand">
    <div class="login__glow login__glow--one" aria-hidden="true"></div>
    <div class="login__glow login__glow--two" aria-hidden="true"></div>
    <div class="login__grid" aria-hidden="true"></div>

    <div class="login__brand-content">
      <p class="login__mark">ReservaFácil</p>
      <h1 class="login__headline">Tu negocio,<br />siempre a tiempo.</h1>
      <p class="login__copy">
        Reservas, métricas y un asistente que responde por ti — todo en un
        solo panel, listo cuando tú lo estés.
      </p>
    </div>
  </section>

  <section class="login__form-side">
    <form class="login__card reveal is-visible" [formGroup]="form" (ngSubmit)="submit()">
      <div class="login__form-header">
        <h2 class="login__title">Bienvenido de vuelta</h2>
        <p class="login__subtitle">Inicia sesión para entrar a tu panel</p>
      </div>

      <label class="field">
        <span class="field__label">Email</span>
        <input
          class="field__input"
          type="email"
          formControlName="email"
          autocomplete="username"
          placeholder="tu@negocio.cl"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field__error">Escribe un email válido.</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Contraseña</span>
        <input
          class="field__input"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="field__error">Escribe tu contraseña.</span>
        }
      </label>

      @if (loginError(); as error) {
        <p class="field__error" role="alert">{{ error }}</p>
      }

      <button class="button login__submit" type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
        }
        Entrar
      </button>
    </form>
  </section>
</main>
