services:
  postgres:
    image: postgres:16-alpine
    container_name: reservafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      # Sin -d, pg_isready responde OK antes de que la base exista.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reservafacil-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP de mentira para desarrollo: atrapa todo el correo saliente y lo
  # muestra en su UI web, sin credenciales ni internet. En producción,
  # SMTP_HOST apunta a un proveedor real — el código del canal no cambia.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: reservafacil-mailpit
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '8025:8025'

volumes:
  pgdata:
  redisdata:
